name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    # Publish semver image tags (:X.Y.Z / :X.Y) when a release tag (v*) is pushed.
    tags: ['v*']
    # Docs-only commits must not trigger a multi-arch build (CI-3).
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  OWNER: chalidnl

jobs:
  gate:
    uses: ./.github/workflows/quality-gate.yml

  build-and-push:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set Docker metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Release tag (e.g. v0.3.0-beta) -> publish semver image tags, no leading 'v'.
            # Stable tags (v0.3.0) additionally get :X.Y so self-hosters can pin a line.
            VER="${GITHUB_REF_NAME#v}"
            if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must match vX.Y.Z or vX.Y.Z-prerelease; got ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            FE="ghcr.io/chalidnl/todoless-frontend:${VER}"
            PB="ghcr.io/chalidnl/todoless-pocketbase:${VER}"
            MINOR=""
            if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              MINOR="${VER%.*}"
            fi
            if [ -n "$MINOR" ]; then
              FE="${FE}"$'\n'"ghcr.io/chalidnl/todoless-frontend:${MINOR}"
              PB="${PB}"$'\n'"ghcr.io/chalidnl/todoless-pocketbase:${MINOR}"
            fi
            BRANCH="$GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "Only main publishes the moving Docker tag; use a v* release tag for versioned images." >&2
              exit 1
            fi
            FE="ghcr.io/chalidnl/todoless-frontend:latest"
            PB="ghcr.io/chalidnl/todoless-pocketbase:latest"
            BRANCH="$GITHUB_REF_NAME"
          fi
          FE="${FE}"$'\n'"ghcr.io/chalidnl/todoless-frontend:${GITHUB_SHA}"
          PB="${PB}"$'\n'"ghcr.io/chalidnl/todoless-pocketbase:${GITHUB_SHA}"
          echo "fe_tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${FE}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "pb_tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${PB}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Generate OCI metadata labels
        id: oci
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/chalidnl/todoless-frontend
            ghcr.io/chalidnl/todoless-pocketbase
          tags: |
            type=ref,event=branch

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build & push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.oci.outputs.labels }}
          tags: ${{ steps.meta.outputs.fe_tags }}
          build-args: |
            VITE_GIT_COMMIT=${{ github.sha }}
            VITE_APP_VERSION=${{ steps.meta.outputs.branch }}
            TODOLESS_TAG=${{ steps.meta.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push pocketbase
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile.pocketbase
          push: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.oci.outputs.labels }}
          tags: ${{ steps.meta.outputs.pb_tags }}
          build-args: |
            TODOLESS_BRANCH=${{ steps.meta.outputs.branch }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
