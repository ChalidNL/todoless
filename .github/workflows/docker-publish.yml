name: Build & Publish Docker Images

on:
  push:
    branches: [main, beta, red, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: chalidnl

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck full React source
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run PocketBase contract tests
        run: node --test tests/*.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan repository for secrets
        run: npm run security:secrets

      - name: Run production build
        env:
          VITE_POCKETBASE_URL: http://pocketbase:8090
        run: npm run build

      - name: Boot PocketBase with the repo's hooks/migrations and run the integration smoke suite (GH#98)
        run: bash scripts/pb-smoke.sh

  migrations-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration idempotency regression (GH#34)
        run: bash scripts/test-migrations-idempotent.sh

      - name: Migration rename sync regression (GH#34)
        run: bash scripts/test-migration-sync.sh

  build-and-push:
    needs: [quality-gate, migrations-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Docker metadata
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "fe_tag=latest" >> $GITHUB_OUTPUT
            echo "pb_tag=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            echo "fe_tag=beta" >> $GITHUB_OUTPUT
            echo "pb_tag=beta" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "pre" ]; then
            echo "fe_tag=pre" >> $GITHUB_OUTPUT
            echo "pb_tag=pre" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "red" ]; then
            echo "fe_tag=red" >> $GITHUB_OUTPUT
            echo "pb_tag=red" >> $GITHUB_OUTPUT
          else
            echo "fe_tag=dev" >> $GITHUB_OUTPUT
            echo "pb_tag=dev" >> $GITHUB_OUTPUT
          fi
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Generate OCI metadata labels
        id: oci
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/chalidnl/todoless-frontend
            ghcr.io/chalidnl/todoless-pocketbase
          tags: |
            type=ref,event=branch

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.oci.outputs.labels }}
          tags: |
            ghcr.io/chalidnl/todoless-frontend:${{ steps.meta.outputs.fe_tag }}
            ghcr.io/chalidnl/todoless-frontend:${{ github.sha }}
          build-args: |
            VITE_GIT_COMMIT=${{ github.sha }}
            VITE_APP_VERSION=${{ steps.meta.outputs.branch }}
            TODOLESS_TAG=${{ steps.meta.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push pocketbase
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pocketbase
          push: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.oci.outputs.labels }}
          tags: |
            ghcr.io/chalidnl/todoless-pocketbase:${{ steps.meta.outputs.pb_tag }}
            ghcr.io/chalidnl/todoless-pocketbase:${{ github.sha }}
          build-args: |
            TODOLESS_BRANCH=${{ steps.meta.outputs.branch }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
