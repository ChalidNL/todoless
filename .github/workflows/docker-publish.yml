name: Build & Publish Docker Images

on:
  push:
    branches: [main, beta, red, dev]
    # Publish semver image tags (:vX.Y.Z / :vX.Y) when a release tag (v*) is pushed
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: chalidnl

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck full React source
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run PocketBase contract tests
        run: node --test tests/*.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan repository for secrets
        run: npm run security:secrets

      - name: Run production build
        env:
          VITE_POCKETBASE_URL: http://pocketbase:8090
        run: npm run build

      - name: Boot PocketBase with the repo's hooks/migrations and run the integration smoke suite (GH#98)
        run: bash scripts/pb-smoke.sh

  build-and-push:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Docker metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Release tag (e.g. v0.3.0-beta) -> publish semver image tags, no leading 'v'.
            # Stable tags (v0.3.0) additionally get :vX.Y so self-hosters can pin a line.
            VER="${GITHUB_REF_NAME#v}"
            FE="ghcr.io/chalidnl/todoless-frontend:${VER}"
            PB="ghcr.io/chalidnl/todoless-pocketbase:${VER}"
            MINOR=""
            if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              MINOR="${VER%.*}"
            fi
            if [ -n "$MINOR" ]; then
              FE="${FE}"$'\n'"ghcr.io/chalidnl/todoless-frontend:${MINOR}"
              PB="${PB}"$'\n'"ghcr.io/chalidnl/todoless-pocketbase:${MINOR}"
            fi
            BRANCH="$GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              T="latest"
            elif [ "$GITHUB_REF_NAME" = "beta" ]; then
              T="beta"
            elif [ "$GITHUB_REF_NAME" = "pre" ]; then
              T="pre"
            elif [ "$GITHUB_REF_NAME" = "red" ]; then
              T="red"
            else
              T="dev"
            fi
            FE="ghcr.io/chalidnl/todoless-frontend:${T}"
            PB="ghcr.io/chalidnl/todoless-pocketbase:${T}"
            BRANCH="$GITHUB_REF_NAME"
          fi
          FE="${FE}"$'\n'"ghcr.io/chalidnl/todoless-frontend:${GITHUB_SHA}"
          PB="${PB}"$'\n'"ghcr.io/chalidnl/todoless-pocketbase:${GITHUB_SHA}"
          echo "fe_tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${FE}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "pb_tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${PB}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Generate OCI metadata labels
        id: oci
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/chalidnl/todoless-frontend
            ghcr.io/chalidnl/todoless-pocketbase
          tags: |
            type=ref,event=branch

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.oci.outputs.labels }}
          tags: ${{ steps.meta.outputs.fe_tags }}
          build-args: |
            VITE_GIT_COMMIT=${{ github.sha }}
            VITE_APP_VERSION=${{ steps.meta.outputs.branch }}
            TODOLESS_TAG=${{ steps.meta.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push pocketbase
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pocketbase
          push: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.oci.outputs.labels }}
          tags: ${{ steps.meta.outputs.pb_tags }}
          build-args: |
            TODOLESS_BRANCH=${{ steps.meta.outputs.branch }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
