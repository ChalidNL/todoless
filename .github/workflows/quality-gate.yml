name: Quality Gate

on:
  pull_request:
  workflow_call:

# NOTE: no top-level concurrency here on purpose. This workflow is reusable
# (workflow_call) and a callee concurrency group on the same ref deadlocks
# with the caller's group ("deadlock detected ... between a top level
# workflow and 'gate'"). The caller (docker-publish.yml) owns concurrency;
# its runs — and therefore the reused jobs — are cancelled when a newer
# push on the same ref arrives.

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run knip
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run PocketBase contract tests
        run: node --test tests/*.test.mjs

      - name: Check pb_hooks files are loadable (GH#31)
        run: bash scripts/check-pb-hooks-loadable.sh

      - name: Check migration immutability (no undeclared renames)
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_call'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-migration-immutability.sh origin/main
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="HEAD~1"
            fi
            bash scripts/check-migration-immutability.sh "$BASE"
          fi

      - name: Audit hardcoded visible strings (i18n gate)
        run: npm run audit:visible-strings

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan repository for secrets
        run: npm run security:secrets

      - name: Run production build
        env:
          VITE_POCKETBASE_URL: http://pocketbase:8090
        run: npm run build

  pocketbase-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Boot PocketBase with the repo's hooks/migrations and run the integration smoke suite (GH#98)
        run: bash scripts/pb-smoke.sh

  migrations-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Migration idempotency regression (GH#34)
        run: bash scripts/test-migrations-idempotent.sh

      - name: Migration rename sync regression (GH#34)
        run: bash scripts/test-migration-sync.sh

      - name: Stale bundled hook/migration pruning regression (GH#35)
        run: bash scripts/test-stale-cleanup.sh

      - name: Entrypoint environment contract (.env.example <-> compose <-> entrypoint)
        run: bash scripts/test-entrypoint-env.sh

      - name: ENCRYPTION_KEY lifecycle against the real PocketBase binary
        run: bash scripts/test-encryption-key.sh

      - name: nginx trusted proxies and dashboard allow-list (real nginx image)
        run: bash scripts/test-nginx-trust.sh

      - name: Setup Node.js (upgrade check)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Upgrade from the previous release tag (#39)
        run: |
          git fetch --force --tags origin
          bash scripts/test-migration-upgrade.sh

      - name: Label privacy upgrade regression (z062 flip + z073 repair)
        run: bash scripts/test-label-privacy-upgrade.sh

      - name: Registration races and owner-role rules (fresh PocketBase)
        run: bash scripts/test-registration-and-roles.sh

      - name: Prod-to-dev anonymizer (secrets, unique identities, failure cleanup)
        run: |
          python3 tests/test_anonymize_prod_to_dev.py
          bash scripts/test-anonymizer.sh

      - name: App-managed manifest currency lint (GH#35)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-app-manifest.sh origin/main
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="HEAD~1"
            fi
            bash scripts/check-app-manifest.sh "$BASE"
          fi

  # Mobile/PWA go-live gate: fresh PocketBase + production build, driven by
  # Playwright at 320-1280px (no horizontal overflow, single scroll surface,
  # onboarding/auth, CRUD journey, docs link, service worker/offline states).
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run mobile E2E suite
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
