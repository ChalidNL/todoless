name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - red
      - dev

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run knip
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run PocketBase contract tests
        run: node --test tests/*.test.mjs

      - name: Check pb_hooks files are loadable (GH#31)
        run: bash scripts/check-pb-hooks-loadable.sh

      - name: Check migration immutability (no undeclared renames)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bash scripts/check-migration-immutability.sh HEAD~1
          else
            bash scripts/check-migration-immutability.sh origin/main
          fi

      - name: Audit hardcoded visible strings (i18n gate)
        run: npm run audit:visible-strings

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan repository for secrets
        run: npm run security:secrets

      - name: Run production build
        env:
          VITE_POCKETBASE_URL: http://pocketbase:8090
        run: npm run build

  pocketbase-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Boot PocketBase with the repo's hooks/migrations and run the integration smoke suite (GH#98)
        run: bash scripts/pb-smoke.sh

  migrations-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration idempotency regression (GH#34)
        run: bash scripts/test-migrations-idempotent.sh

      - name: Migration rename sync regression (GH#34)
        run: bash scripts/test-migration-sync.sh

      - name: Stale bundled hook/migration pruning regression (GH#35)
        run: bash scripts/test-stale-cleanup.sh

      - name: App-managed manifest currency lint (GH#35)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bash scripts/check-app-manifest.sh HEAD~1
          else
            bash scripts/check-app-manifest.sh origin/main
          fi
