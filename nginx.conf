# Rate-limit zones live at http context; conf.d/*.conf is included inside nginx's http block.
# SECURITY: the rate-limit key and the dashboard allow-list use $remote_addr
# AFTER ngx_http_realip_module, so a direct caller can never forge it with a
# client header: X-Forwarded-For / CF-Connecting-IP / ... are only believed
# from the reverse proxies listed in TODOLESS_TRUSTED_PROXIES (default: none).
# docker/nginx-trust.sh writes that list to /tmp at container start (the
# container filesystem is read-only); without it, no header is trusted.
include /tmp/todoless-nginx/realip*.conf;

# A request that carries a proxy header came through a reverse proxy (Caddy,
# Traefik, cloudflared, ...). Behind such a proxy every visitor arrives from
# the proxy's private address, so the dashboard's private-network allow-list
# below cannot tell the internet from the LAN: /_/ refuses proxied requests,
# unless they came from a trusted proxy (then the real client IP is judged).
# A direct LAN/Tailscale request carries none of these headers; a client that
# forges one only locks itself out.
map "$http_x_forwarded_for$http_forwarded$http_x_real_ip$http_cf_connecting_ip" $todoless_proxied {
    ""      0;
    default 1;
}

# A request from a trusted proxy (TODOLESS_TRUSTED_PROXIES) has its real
# client address in $remote_addr, so the allow-list can judge it: realip
# replaced the address, so it differs from the TCP peer ($realip_remote_addr).
map "$remote_addr|$realip_remote_addr" $todoless_via_trusted_proxy {
    "~^([^|]*)\|\1$" 0;
    default        1;
}

map "$todoless_proxied$todoless_via_trusted_proxy" $todoless_dashboard_refused {
    "10"    1;
    default 0;
}

limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
# GH#42: a rejected limit_req request must answer 429 (Not Modified semantics:
# "Too Many Requests"), not nginx's default 503, so clients can tell throttling
# apart from an outage. The JSON body + Retry-After come from the @ratelimited
# named location wired via error_page below.
limit_req_status 429;
# Define the log format explicitly (project name to avoid clashing with the base
# image's bundled "main" format) so the config is self-contained.
# Referer as logged: scheme://host/path only. A page opened from a link that
# carried a secret in its query string (pre-v1.0.0 reset/invite mails) must
# not leak it into the log through the Referer of its follow-up requests.
map $http_referer $todoless_referer {
    "~^(?<todoless_ref_base>[^?#]*)" $todoless_ref_base;
    default "-";
}
log_format todoless '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$todoless_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
# Same as above but without the query string, for URLs that carry a secret
# (calendar feed tokens #100, invite codes #258, legacy reset links #68).
# The original request path without its query string ($uri would show the
# internal try_files target, /index.html, for SPA routes).
map $request_uri $todoless_request_path {
    "~^(?<todoless_path_base>[^?]*)" $todoless_path_base;
    default "-";
}
log_format todoless_noquery '$remote_addr - $remote_user [$time_local] "$request_method $todoless_request_path $server_protocol" '
                    '$status $body_bytes_sent "-" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

# GH#44: only forward Upgrade/Connection headers to the pocketbase upstream when
# the client actually asked for an upgrade (WebSocket). Sending
# `Connection: upgrade` on every plain /api/ request is the documented
# anti-pattern and can break keep-alive with other upstreams.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    # Non-root nginx (uid 101) cannot bind port 80; the nginx-unprivileged image
    # serves on 8080 (GH#45). Compose maps host ${TODOLESS_PORT} -> 8080.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    # uid 101 has no write access to /var/log/nginx, so logs go to the container
    # stdout/stderr (docker logs / Dozzle / Loki) — no writable log volume needed.
    error_log /dev/stderr notice;
    access_log /dev/stdout todoless;
    # Keep request bodies large enough for user uploads proxied to PocketBase.
    client_max_body_size 25m;
    # Security headers. HSTS is intentionally NOT set here because this container
    # serves plain HTTP; set Strict-Transport-Security only on the TLS terminator.
    # X-XSS-Protection is intentionally omitted (deprecated; modern browsers ignore
    # it and it can introduce XSS filtering quirks in legacy ones).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Remove server version header
    server_tokens off;

    # GH#42: rate-limited requests get a JSON body with a Retry-After header
    # instead of nginx's default HTML 503 page. `=` keeps the 429 status from
    # the named location's return directive.
    error_page 429 = @ratelimited;

    # Silent health endpoint for container healthchecks (GH#55). The compose
    # healthcheck used to wget-spider / every 15s, which wrote one access-log
    # line per probe (~5,700 lines/day) and drowned out real traffic. Exact
    # match so the probe never falls through to the SPA shell, and access_log
    # off so probes stay invisible.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed static assets from Vite build — immutable, cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Repeat security headers (add_header in nested block overrides parent)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # App shell, service worker metadata, and version markers must never be
    # cached. If any of these are stale, installed PWAs can keep serving an
    # old hashed JS bundle even after a successful deploy.
    # Web app manifest: same no-cache policy as below, plus the registered
    # application/manifest+json type (stock mime.types maps .webmanifest to
    # application/octet-stream). Exact match wins over the regex location.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Repeat security headers (add_header in nested block overrides parent)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|version\.json)$ {
        # SPA routes are served from here via try_files (an internal redirect
        # logs in the final location): never log their query string.
        access_log /dev/stdout todoless_noquery;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Repeat security headers (add_header in nested block overrides parent)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }
    # App shell (SPA routes). The only query strings these URLs carry are
    # one-time secrets from links sent before v1.0.0 (?token= reset, ?invite=
    # invite), so they are logged without it, and the page sends no Referer
    # (the app itself needs none) so the secret can't follow its requests.
    location / {
        access_log /dev/stdout todoless_noquery;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Repeat security headers (add_header in nested block overrides parent)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
        # Superuser (dashboard) logins and OTP/MFA endpoints get the same
    # per-client limit as user logins: they are the most valuable target.
    location ~ ^/api/collections/(users|_superusers)/(auth-with-password|auth-with-otp|request-otp|request-password-reset|confirm-password-reset|request-verification|confirm-verification)$ {
        limit_req zone=api_auth burst=10 nodelay;
        client_max_body_size 25m;
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        # API responses must never be cached by browsers or intermediaries.
        add_header Cache-Control "no-store" always;
        # Repeat security headers (add_header in nested block overrides parent)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # Swagger UI docs pages: swagger-ui-dist is vendored same-origin
    # (/docs/swagger-ui/*) and the bootstrap lives in swagger-ui-init.js, so the
    # docs run under the app-wide strict CSP (script-src 'self', no CDN, no
    # inline scripts). Scoped to these two routes only for rate limiting.
    location ~ ^/api/(docs|swagger)$ {
        limit_req zone=api_general burst=120 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # API docs pages must never be cached by browsers or intermediaries.
        add_header Cache-Control "no-store" always;
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    # Subscribable calendar feed (#100): the API token travels in ?token=, so
    # this route is logged without its query string. Cache headers (ETag,
    # Last-Modified) come from PocketBase; security headers are inherited.
    # Invite validation (#258): the code travels in ?code=, so this route is
    # logged without its query string.
    location = /api/validate-invite {
        access_log /dev/stdout todoless_noquery;
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    location = /api/calendar.ics {
        access_log /dev/stdout todoless_noquery;
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    # PocketBase realtime/SSE: disable buffering so events are delivered immediately.
    location /api/realtime {
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        # SSE is a live stream — never cache.
        add_header Cache-Control "no-store" always;
        # Repeat security headers (add_header in nested block overrides parent)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    location /api/ {
        limit_req zone=api_general burst=120 nodelay;
        client_max_body_size 25m;
        proxy_pass http://pocketbase:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        # API responses must never be cached by browsers or intermediaries.
        add_header Cache-Control "no-store" always;
        # Repeat security headers (add_header in nested block overrides parent)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # GH#42: human-readable JSON for rate-limited requests. Retry-After is the
    # worst-case wait for the strictest zone (api_auth: 5r/m = one request every
    # 12s after the burst is exhausted); it must be sent explicitly because
    # ngx_http_limit_req_module never emits Retry-After on its own.
    location @ratelimited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 12 always;
        return 429 '{"error":"rate_limited"}';
    }

    # PocketBase admin dashboard (/_/): reachable ONLY from the addresses in
    # TODOLESS_DASHBOARD_ALLOW (default: loopback, 10/8, 192.168/16, Tailscale
    # 100.64/10, IPv6 ULA - see docker/nginx-trust.sh). Everyone else gets a
    # 403 so the dashboard is never exposed on the open web; if the generated
    # list is missing, only `deny all` remains. Upgrade headers are forwarded
    # so the dashboard's realtime features work through the proxy. No
    # add_header here on purpose: this block inherits the server-level
    # security headers (incl. CSP), and PB sets its own cache-control on
    # dashboard responses.
    location /_/ {
        # Never through an untrusted reverse proxy (see $todoless_proxied).
        if ($todoless_dashboard_refused) {
            return 403;
        }
        include /tmp/todoless-nginx/dashboard-allow*.conf;
        deny all;
        client_max_body_size 25m;
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}
