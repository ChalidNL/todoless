name: todoless

services:
  todoless:
    image: ghcr.io/chalidnl/todoless-frontend:latest
    container_name: todoless
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      TZ: Europe/Amsterdam
      DEPLOY_ENV: production
    ports:
      - target: 80
        published: "${TODOLESS_PORT:-7070}"
        protocol: tcp
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - todoless-net
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "80"
          description:
            en_US: Web UI

  pocketbase:
    image: ghcr.io/chalidnl/todoless-pocketbase:latest
    container_name: todoless-pocketbase
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    entrypoint: ["/entrypoint.sh"]
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb_data", "--migrationsDir=/pb_migrations", "--hooksDir=/pb_hooks", "--automigrate"]
    environment:
      TZ: Europe/Amsterdam
      DEPLOY_ENV: production
      COMMIT_SHA: ${COMMIT_SHA:-unknown}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # PocketBase settings bootstrap (GH#51) — read by migration z067 on
      # first start; empty values are ignored (settings are applied once).
      APP_NAME: ${APP_NAME:-}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-}
      TRUSTED_PROXY_USE_LEFTMOST_IP: ${TRUSTED_PROXY_USE_LEFTMOST_IP:-}
    # No published ports — only accessible via nginx proxy on todoless-net
    volumes:
      - /DATA/AppData/todoless/pb_data:/pb_data
      - /DATA/AppData/todoless/pb_migrations:/pb_migrations
      - /DATA/AppData/todoless/pb_hooks:/pb_hooks
    networks:
      - todoless-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    x-casaos:
      volumes:
        - container: /pb_data
          description:
            en_US: PocketBase data — database and uploads
        - container: /pb_migrations
          description:
            en_US: PocketBase migration scripts
        - container: /pb_hooks
          description:
            en_US: PocketBase server-side hooks

networks:
  todoless-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: todoless
  author: self-hosted
  category: Productivity
  description:
    en_US: todoless — self-hosted multi-user task manager. Tasks, notes, calendar, brain dumps, real-time sync. Free forever.
  icon: https://cdn.jsdelivr.net/gh/ChalidNL/todoless@main/public/icons/icon-512.png
  tagline:
    en_US: Self-hosted productivity app
  title:
    en_US: todoless
  port_map: "${TODOLESS_PORT:-7070}"
  scheme: http
  index: /
