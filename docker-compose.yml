name: todoless

services:
  todoless:
    # GH#47: digest-pinned to the v1.0.0 release image; dependabot renews the pin.
    image: ghcr.io/chalidnl/todoless-frontend@sha256:7ce16521801da331f735083ede9c9c03bad50ca4249c65c211792099bc304169
    container_name: todoless
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      DEPLOY_ENV: production
    ports:
      - target: 8080
        published: "${TODOLESS_PORT:-7070}"
        protocol: tcp
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - todoless-net
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8080"
          description:
            en_US: Web UI

  pocketbase:
    # GH#47: digest-pinned to the v1.0.0 release image; dependabot renews the pin.
    image: ghcr.io/chalidnl/todoless-pocketbase@sha256:0a3eb00f9b1e113ef62ed1c5769c9df6204bc6dafc194d3db3512630d33621fc
    container_name: todoless-pocketbase
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # GH#45: fixed non-root UID — the image also sets USER 1000. No capabilities
    # are required: cap_drop ALL, no cap_add (the old CHOWN/DAC_OVERRIDE pair was
    # only needed because the container ran as root and chowned the volumes).
    user: "1000:1000"
    cap_drop:
      - ALL
    entrypoint: ["/entrypoint.sh"]
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb_data", "--migrationsDir=/pb_migrations", "--hooksDir=/pb_hooks", "--automigrate=false"]
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      DEPLOY_ENV: production
      # branch/commit are baked into the image at build time (GH#33); a runtime
      # -e COMMIT_SHA/TODOLESS_BRANCH override wins when explicitly provided.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_WEBHOOK_SECRET: ${MAIL_WEBHOOK_SECRET:-}  # inbound mail webhook shared secret (Bearer token); the mail webhook fails closed with 503 if unset
      # GH#50: optional PocketBase superuser bootstrap (admin dashboard at /_/).
      # The entrypoint runs `pocketbase superuser upsert` when both are set.
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      # PocketBase settings bootstrap (GH#51) — read by migration z067 on
      # first start; empty values are ignored (settings are applied once).
      APP_NAME: ${APP_NAME:-}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH_METHOD: ${SMTP_AUTH_METHOD:-}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-}
      TRUSTED_PROXY_USE_LEFTMOST_IP: ${TRUSTED_PROXY_USE_LEFTMOST_IP:-}
    # No published ports — only accessible via nginx proxy on todoless-net
    volumes:
      - /DATA/AppData/todoless/pb_data:/pb_data
      - /DATA/AppData/todoless/pb_migrations:/pb_migrations
      - /DATA/AppData/todoless/pb_hooks:/pb_hooks
    networks:
      - todoless-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8090/api/hook-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    x-casaos:
      envs:
        - container: MAIL_WEBHOOK_SECRET
          description:
            en_US: Inbound mail webhook shared secret (Bearer token)
        - container: POCKETBASE_ADMIN_EMAIL
          description:
            en_US: PocketBase admin (superuser) email - creates the dashboard login (/_/) on start (optional)
        - container: POCKETBASE_ADMIN_PASSWORD
          description:
            en_US: PocketBase admin (superuser) password - set together with POCKETBASE_ADMIN_EMAIL (optional)
      volumes:
        - container: /pb_data
          description:
            en_US: PocketBase data — database and uploads
        - container: /pb_migrations
          description:
            en_US: PocketBase migration scripts
        - container: /pb_hooks
          description:
            en_US: PocketBase server-side hooks

networks:
  todoless-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: todoless
  author: self-hosted
  category: Productivity
  description:
    en_US: todoless — the self-hosted family organizer for tasks, calendar and groceries. Your family. Your data. Free and open source.
  icon: https://cdn.jsdelivr.net/gh/ChalidNL/todoless@main/public/icons/icon-512.png
  tagline:
    en_US: Less managing. More living.
  title:
    en_US: todoless
  port_map: "${TODOLESS_PORT:-7070}"
  scheme: http
  index: /
