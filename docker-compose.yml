name: todoless

services:
  todoless:
    image: ghcr.io/chalidnl/todoless-frontend:latest
    container_name: todoless
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      TZ: Europe/Amsterdam
      DEPLOY_ENV: production
    ports:
      - target: 8080
        published: "${TODOLESS_PORT:-7070}"
        protocol: tcp
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - todoless-net
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      ports:
        - container: "8080"
          description:
            en_US: Web UI

  pocketbase:
    image: ghcr.io/chalidnl/todoless-pocketbase:latest
    container_name: todoless-pocketbase
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # GH#45: fixed non-root UID — the image also sets USER 1000. No capabilities
    # are required: cap_drop ALL, no cap_add (the old CHOWN/DAC_OVERRIDE pair was
    # only needed because the container ran as root and chowned the volumes).
    user: "1000:1000"
    cap_drop:
      - ALL
    entrypoint: ["/entrypoint.sh"]
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb_data", "--migrationsDir=/pb_migrations", "--hooksDir=/pb_hooks", "--automigrate"]
    environment:
      TZ: Europe/Amsterdam
      DEPLOY_ENV: production
      # branch/commit are baked into the image at build time (GH#33); a runtime
      # -e COMMIT_SHA/TODOLESS_BRANCH override (as in todoless-deploy-prod.sh)
      # wins when explicitly provided.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # GH#50: optional PocketBase superuser bootstrap (admin dashboard at /_/).
      # The entrypoint runs `pocketbase superuser upsert` when both are set.
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
    # No published ports — only accessible via nginx proxy on todoless-net
    volumes:
      - /DATA/AppData/todoless/pb_data:/pb_data
      - /DATA/AppData/todoless/pb_migrations:/pb_migrations
      - /DATA/AppData/todoless/pb_hooks:/pb_hooks
    networks:
      - todoless-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8090/api/hook-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    x-casaos:
      volumes:
        - container: /pb_data
          description:
            en_US: PocketBase data — database and uploads
        - container: /pb_migrations
          description:
            en_US: PocketBase migration scripts
        - container: /pb_hooks
          description:
            en_US: PocketBase server-side hooks
      envs:
        - container: POCKETBASE_ADMIN_EMAIL
          description:
            en_US: PocketBase admin (superuser) email - creates the dashboard login (/_/) on start (optional)
        - container: POCKETBASE_ADMIN_PASSWORD
          description:
            en_US: PocketBase admin (superuser) password - set together with POCKETBASE_ADMIN_EMAIL (optional)

networks:
  todoless-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: todoless
  author: self-hosted
  category: Productivity
  description:
    en_US: todoless — self-hosted multi-user task manager. Tasks, notes, calendar, brain dumps, real-time sync. Free forever.
  icon: https://cdn.jsdelivr.net/gh/ChalidNL/todoless@main/public/icons/icon-512.png
  tagline:
    en_US: Self-hosted productivity app
  title:
    en_US: todoless
  port_map: "${TODOLESS_PORT:-7070}"
  scheme: http
  index: /
