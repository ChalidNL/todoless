name: todoless

services:
  todoless:
    image: ghcr.io/chalidnl/todoless-frontend:latest
    container_name: todoless
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      TZ: Europe/Amsterdam
      DEPLOY_ENV: production
      # GH#41 - real client IP behind a reverse proxy. Leave unset (default)
      # when todoless is reached directly (LAN/Tailscale): no forwarded header
      # is trusted, rate-limit keys use the real socket peer. Set them when
      # running behind Caddy/Traefik/nginx/Cloudflare - see README.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-}
    ports:
      - target: 8080
        published: "${TODOLESS_PORT:-7070}"
        protocol: tcp
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - todoless-net
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
        - container: TRUSTED_PROXY_CIDRS
          description:
            en_US: "Optional (GH#41): comma/space-separated CIDRs of your reverse proxy (e.g. 172.18.0.0/16). Enables real client IP for rate limiting. Leave empty if no proxy."
        - container: REAL_IP_HEADER
          description:
            en_US: "Optional (GH#41): forwarded client-IP header from your proxy (X-Forwarded-For for Caddy/Traefik, CF-Connecting-IP for Cloudflare). Ignored unless TRUSTED_PROXY_CIDRS is set."
      ports:
        - container: "8080"
          description:
            en_US: Web UI

  pocketbase:
    image: ghcr.io/chalidnl/todoless-pocketbase:latest
    container_name: todoless-pocketbase
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # GH#45: fixed non-root UID — the image also sets USER 1000. No capabilities
    # are required: cap_drop ALL, no cap_add (the old CHOWN/DAC_OVERRIDE pair was
    # only needed because the container ran as root and chowned the volumes).
    user: "1000:1000"
    cap_drop:
      - ALL
    entrypoint: ["/entrypoint.sh"]
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb_data", "--migrationsDir=/pb_migrations", "--hooksDir=/pb_hooks", "--automigrate"]
    environment:
      TZ: Europe/Amsterdam
      DEPLOY_ENV: production
      # branch/commit are baked into the image at build time (GH#33); a runtime
      # -e COMMIT_SHA/TODOLESS_BRANCH override (as in todoless-deploy-prod.sh)
      # wins when explicitly provided.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_WEBHOOK_SECRET: ${MAIL_WEBHOOK_SECRET:-}  # inbound mail webhook shared secret (Bearer token); the mail webhook fails closed with 503 if unset
      PAPERLESS_WEBHOOK_SECRET: ${PAPERLESS_WEBHOOK_SECRET:-}  # Paperless-ngx webhook shared secret; the paperless webhook fails closed with 503 if unset
      # PocketBase settings bootstrap (GH#51) — read by migration z069 on
      # first start; empty values are ignored (settings are applied once).
      APP_NAME: ${APP_NAME:-}
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-}
      TRUSTED_PROXY_USE_LEFTMOST_IP: ${TRUSTED_PROXY_USE_LEFTMOST_IP:-}
    # No published ports — only accessible via nginx proxy on todoless-net
    volumes:
      - /DATA/AppData/todoless/pb_data:/pb_data
      - /DATA/AppData/todoless/pb_migrations:/pb_migrations
      - /DATA/AppData/todoless/pb_hooks:/pb_hooks
    networks:
      - todoless-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8090/api/hook-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    x-casaos:
      envs:
        - container: MAIL_WEBHOOK_SECRET
          description:
            en_US: Inbound mail webhook shared secret (Bearer token)
        - container: PAPERLESS_WEBHOOK_SECRET
          description:
            en_US: Paperless-ngx webhook shared secret
      volumes:
        - container: /pb_data
          description:
            en_US: PocketBase data — database and uploads
        - container: /pb_migrations
          description:
            en_US: PocketBase migration scripts
        - container: /pb_hooks
          description:
            en_US: PocketBase server-side hooks

networks:
  todoless-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: todoless
  author: self-hosted
  category: Productivity
  description:
    en_US: todoless — self-hosted multi-user task manager. Tasks, notes, calendar, brain dumps, real-time sync. Free forever.
  icon: https://cdn.jsdelivr.net/gh/ChalidNL/todoless@main/public/icons/icon-512.png
  tagline:
    en_US: Self-hosted productivity app
  title:
    en_US: todoless
  port_map: "${TODOLESS_PORT:-7070}"
  scheme: http
  index: /
